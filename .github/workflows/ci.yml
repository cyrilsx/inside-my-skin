name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files for secret patterns
        run: bash infra/scripts/scan-secrets.sh

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: POSTGRES_PASSWORD=ci-placeholder docker compose -f infra/docker-compose.yml config --quiet
      - name: Validate docker-compose.prod.yml
        run: |
          POSTGRES_PASSWORD=ci JWT_SIGNING_KEY=ci TOKEN_ENCRYPTION_KEY=ci WEBHOOK_SECRET=ci \
            docker compose -f infra/docker-compose.prod.yml config --quiet

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Backend tests
        run: ./mvnw test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Frontend type + build gate
        working-directory: frontend
        run: npm run build

  android:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /opt/android-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Android unit tests + debug APK
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (infra/docker/Dockerfile)
        run: docker build -f infra/docker/Dockerfile -t ghcr.io/cyrilsx/inside-my-skin:${{ github.sha }} .
      - name: Push to GHCR (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/cyrilsx/inside-my-skin:${{ github.sha }} ghcr.io/cyrilsx/inside-my-skin:latest
          docker push ghcr.io/cyrilsx/inside-my-skin:${{ github.sha }}
          docker push ghcr.io/cyrilsx/inside-my-skin:latest
