server:
  port: 8080

spring:
  application:
    name: healthhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthhub}
    username: ${POSTGRES_USER:healthhub}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    url: /openapi.yaml

healthhub:
  webhook:
    secret: ${WEBHOOK_SECRET:}
  sync:
    enabled: ${SYNC_ENABLED:true}
    interval-ms: ${SYNC_INTERVAL_MS:3600000}
    initial-delay-ms: ${SYNC_INITIAL_DELAY_MS:60000}
  garmin:
    enabled: ${GARMIN_ENABLED:false}
    personal-key: ${GARMIN_PERSONAL_KEY:}
    key-header: ${GARMIN_KEY_HEADER:}
    base-url: ${GARMIN_BASE_URL:https://connect.garmin.com}
    user-id: ${GARMIN_USER_ID:}
  withings:
    enabled: ${WITHINGS_ENABLED:false}
    client-id: ${WITHINGS_CLIENT_ID:}
    client-secret: ${WITHINGS_CLIENT_SECRET:}
    callback-secret: ${WITHINGS_CALLBACK_SECRET:}
    redirect-uri: ${WITHINGS_REDIRECT_URI:http://localhost:8080/connect/withings/callback}
    base-url: ${WITHINGS_BASE_URL:https://wbs.withings.net}
    authorize-url: ${WITHINGS_AUTHORIZE_URL:https://account.withings.com/oauth2_user/authorize2}
    scope: ${WITHINGS_SCOPE:user.info,user.metrics,user.activity}
