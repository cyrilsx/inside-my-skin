server:
  port: 8080

spring:
  application:
    name: healthhub
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/healthhub}
    username: ${POSTGRES_USER:healthhub}
    password: ${POSTGRES_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    url: /openapi.yaml
