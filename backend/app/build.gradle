plugins {
    id 'org.springframework.boot' version '4.1.0'
}

description = 'Assembly, configuration, security'

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.1.0')

    implementation project(':backend:core-domain')
    implementation project(':backend:ingestion')
    implementation project(':backend:api')
    implementation project(':backend:companion-api')
    implementation project(':backend:insights')
    implementation project(':backend:providers:withings')
    implementation project(':backend:providers:garmin')

    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

tasks.named('processResources') {
    from(rootProject.file('docs/openapi.yaml')) {
        into 'static'
    }
}
