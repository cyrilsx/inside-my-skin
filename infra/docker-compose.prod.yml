# Production topology (Infomaniak Cloud Server / any Docker host).
#   cp .env.prod.example .env.prod   # fill in, chmod 600 — never commit .env.prod
#   docker compose -f infra/docker-compose.prod.yml up -d
# Put a TLS-terminating reverse proxy (Caddy/nginx/Jelastic) in front of :8080.
services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-healthhub}
      POSTGRES_USER: ${POSTGRES_USER:-healthhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env.prod}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set TOKEN_ENCRYPTION_KEY in .env.prod}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?set WEBHOOK_SECRET in .env.prod}
      SYNC_ENABLED: ${SYNC_ENABLED:-true}
      GARMIN_ENABLED: ${GARMIN_ENABLED:-false}
      GARMIN_PERSONAL_KEY: ${GARMIN_PERSONAL_KEY:-}
      GARMIN_KEY_HEADER: ${GARMIN_KEY_HEADER:-}
      GARMIN_USER_ID: ${GARMIN_USER_ID:-}
      WITHINGS_ENABLED: ${WITHINGS_ENABLED:-false}
      WITHINGS_CLIENT_ID: ${WITHINGS_CLIENT_ID:-}
      WITHINGS_CLIENT_SECRET: ${WITHINGS_CLIENT_SECRET:-}
      WITHINGS_CALLBACK_SECRET: ${WITHINGS_CALLBACK_SECRET:-}
      WITHINGS_REDIRECT_URI: ${WITHINGS_REDIRECT_URI:-https://REPLACE-ME.example.com/connect/withings/callback}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-healthhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-healthhub}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-healthhub} -d $${POSTGRES_DB:-healthhub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
